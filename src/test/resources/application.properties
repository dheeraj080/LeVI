spring.application.name=levi
server.port=4000

# DATA SOURCE
spring.datasource.url=jdbc:postgresql://localhost:4001/levi_db?jdbcCompliantTruncation=false&sessionVariables=time_zone='%2B00:00'
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pooling / Health
# Connection Pooling / Health
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / HIBERNATE
spring.jpa.show-sql=true
# Use 'update' for local dev, 'validate' for prod
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# EMAIL
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_USERNAME}
spring.mail.password=${BREVO_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.from=${BREVO_SENDER_EMAIL}

# Security OAuth2 Configuration - Google
# http://localhost:4000/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile,openid

# Security OAuth2 Configuration - GitHub
# http://localhost:4000/login/oauth2/code/github
# http://localhost:4000/oauth2/authorization/github
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:email,read:user

# Logging Configuration
logging.level.org.springframework.security=DEBUG

# Custom Security JWT Configuration
security.jwt.secret=${JWT_SECRET:3abac16c63451e13f9a98e15b89e951ac63e0624c0da75b0db558215e9a6de45}
security.jwt.issuer=${JWT_ISSUER:api.lv.com}
security.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:2600}
security.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:86400}
security.jwt.refresh-token-cookie-name=${JWT_REFRESH_COOKIE_NAME:refreshToken}
security.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
security.jwt.cookie-http-only=${JWT_COOKIE_HTTP_ONLY:true}
security.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:lax}
security.jwt.cookie-domain=${JWT_COOKIE_DOMAIN:localhost:4000}
