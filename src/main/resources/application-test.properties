# Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:levi_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable Flyway for tests to avoid connection errors
spring.flyway.enabled=false

# Relaxed Security TTL for testing
security.jwt.access-ttl-seconds=3600