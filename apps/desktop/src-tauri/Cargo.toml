[package]
name = "levi-desktop"
version = "0.0.0"
description = "Levi Desktop"
authors = ["Levi contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dheeraj080/LeVI"
edition = "2021"
rust-version = "1.89"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lev-core = { path = "../../../crates/lev-core" }
lev-engine = { path = "../../../crates/lev-engine" }
lev-http = { path = "../../../crates/lev-http" }
lev-format = { path = "../../../crates/lev-format" }
lev-protocol = { path = "../../../crates/lev-protocol" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
bytes = "1.11.1"
chrono = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
