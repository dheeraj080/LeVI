[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
authors = ["Levi contributors"]
repository = "https://github.com/levi/levi"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "unwind"
incremental = false
