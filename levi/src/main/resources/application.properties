spring.application.name=transaction-service
server.port=4000

# DATA SOURCE
spring.datasource.url=jdbc:postgresql://levi-db:5432/levi_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pooling / Health
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / HIBERNATE
spring.jpa.show-sql=true
# Use 'update' for local dev, 'validate' for prod
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# EMAIL
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_USERNAME}
spring.mail.password=${BREVO_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.from=${BREVO_SENDER_EMAIL}
