[package]
name = "lev-script"
description = "Levi script sandbox: a pooled QuickJS runtime with a lev.* API, CPU budget, and memory limit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
lev-core = { version = "0.0.0", path = "../lev-core" }
# QuickJS-NG bindings: a real sandbox (interrupt handler + memory limit) rather than a
# best-effort interpreter. Pre-generated bindings, so no libclang is needed at build.
rquickjs = "0.9.0"
serde_json = "1.0.154"
thiserror = "2.0.21"
