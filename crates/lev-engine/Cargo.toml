[package]
name = "lev-engine"
description = "The Levi engine facade: protocol handling, DTO conversions, and the daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
lev-core = { version = "0.0.0", path = "../lev-core" }
lev-http = { version = "0.0.0", path = "../lev-http" }
lev-protocol = { version = "0.0.0", path = "../lev-protocol" }
lev-script = { version = "0.0.0", path = "../lev-script" }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "macros"] }

[dev-dependencies]
bytes = "1.12.1"
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "io-util"] }
wiremock = "0.6.5"
