[package]
name = "lev-cli"
description = "The `levi` command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "levi"
path = "src/main.rs"

[dependencies]
lev-core = { version = "0.0.0", path = "../lev-core" }
lev-engine = { version = "0.0.0", path = "../lev-engine" }
lev-format = { version = "0.0.0", path = "../lev-format" }
lev-load = { version = "0.0.0", path = "../lev-load" }
lev-metrics = { version = "0.0.0", path = "../lev-metrics" }
lev-protocol = { version = "0.0.0", path = "../lev-protocol" }
mimalloc = "0.1.52"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = { version = "0.7.20", features = ["rt"] }

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "process", "io-util"] }
wiremock = "0.6.5"
