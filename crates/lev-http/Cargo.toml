[package]
name = "lev-http"
description = "Levi HTTP transport: a single hyper-based client with per-phase timing. Used for both interactive and load paths."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22.1"
brotli = "8"
bytes = "1.12.1"
flate2 = "1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1", "http2", "server"] }
hyper-rustls = { version = "0.27.7", default-features = false, features = ["http1", "http2", "ring", "native-tokio", "tls12", "logging"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
lev-core = { version = "0.0.0", path = "../lev-core" }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.5"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
tower-service = "0.3.1"
tracing = "0.1.44"
url = "2.5.8"
