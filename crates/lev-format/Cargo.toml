[package]
name = "lev-format"
description = "Levi collection format: on-disk DTOs and (de)serialization behind a DocumentFormat boundary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
lev-core = { version = "0.0.0", path = "../lev-core" }
serde = { version = "1.0.229", features = ["derive"] }
# `serde-saphyr` replaces `serde_yaml_ng`: it is pure safe Rust (no `unsafe-libyaml`,
# which is unmaintained per RUSTSEC-2024-0449), fuzz-tested not to panic on malformed
# input, and it emits block scalars for multi-line strings.
serde-saphyr = "1.3.0"
thiserror = "2.0.21"

[dev-dependencies]
insta = "1.49.0"
